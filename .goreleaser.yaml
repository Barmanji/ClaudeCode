version: 2

project_name: c-lawd-code

before:
  hooks:
    - go mod tidy

builds:
  - id: clawd
    main: ./cmd/clawd
    binary: clawd
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}

archives:
  # Human-friendly tarballs for the curl installer.
  - id: tarballs
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
  # Raw binaries consumed by the npm launcher's fallback downloader.
  - id: raw
    formats: [binary]
    name_template: "clawd_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt
  algorithm: sha256

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  github:
    owner: Barmanji
    name: ClaudeCode
  draft: false
  prerelease: auto
